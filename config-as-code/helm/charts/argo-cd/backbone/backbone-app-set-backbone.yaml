apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: who-afro-backbone-appset
  namespace: argocd

spec:
  generators:
    - git:
        repoURL: git@github.com:HCM-WHO-AFRO/health-campaign-devops.git
        revision: azure-install-who-test
        directories:
          - path: config-as-code/helm/charts/backbone-used-charts/*

  template:
    metadata:
      name: 'backbone-{{path.basename}}'

    spec:
      project: backbone-project

      source:
        repoURL: git@github.com:HCM-WHO-AFRO/health-campaign-devops.git
        targetRevision: azure-install-who-test
        path: '{{path}}'

        helm:
          valueFiles:
            - values.yaml
            - ../../../../environments/who-afro-hcm.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: default

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas

        # The API server stamps apiVersion, kind, creationTimestamp and status
        # onto every volumeClaimTemplate, which no chart emits, so a StatefulSet
        # is reported OutOfSync forever and selfHeal re-applies it on every
        # reconcile. Scoped to those injected fields, so a real storage change
        # is still flagged.
        - group: apps
          kind: StatefulSet
          jqPathExpressions:
            - '.spec.volumeClaimTemplates[]?.apiVersion'
            - '.spec.volumeClaimTemplates[]?.kind'
            - '.spec.volumeClaimTemplates[]?.metadata.creationTimestamp'
            - '.spec.volumeClaimTemplates[]?.status'

      syncPolicy:
        automated:
          prune: false
          selfHeal: true

        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true

        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
