{{- include "superset.init" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-nginx-config
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_types text/plain text/css text/xml text/javascript
                   application/x-javascript application/xml+rss
                   application/json application/javascript;

        # Temp paths under /tmp so the container can run non-root.
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp_path;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        upstream superset_app {
            server 127.0.0.1:8088;
            keepalive 100;
        }

        server {
            listen {{ .Values.web.nginx.port }} default_server;
            server_name _;
            client_max_body_size {{ .Values.web.nginx.clientMaxBodySize }};

            # Emit relative Location headers. Otherwise nginx builds them from
            # its own listen port and the browser is sent to
            # https://<domain>:8080/analytics/, which is not reachable.
            absolute_redirect off;
            port_in_redirect off;

            # Probe target — the kubelet has no /analytics prefix to send, but
            # the app only answers under it.
            location = /health {
                proxy_pass http://superset_app{{ .Values.contextPath }}/health;
                proxy_set_header Host $http_host;
            }

            # Superset 6 mounts itself at APPLICATION_ROOT and builds every URL
            # — pages, assets and API calls alike — with the prefix already in
            # place. So the prefix is passed straight through, and no
            # X-Forwarded-Prefix is sent: ProxyFix would add a second one on
            # top of the mount point.
            #
            # Superset 4 did none of this, which is why earlier revisions of
            # this chart stripped the prefix and routed ~40 paths at the domain
            # root. Reinstate none of that without re-testing against the
            # running version.
            location {{ .Values.contextPath }}/static/ {
                proxy_pass http://superset_app;
                proxy_set_header Host $http_host;
                expires 30d;
                add_header Cache-Control "public, immutable";
                access_log off;
            }

            location {{ .Values.contextPath }} {
                proxy_pass http://superset_app;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                # X-Forwarded-Proto/Port/Host are deliberately NOT set here.
                # ingress-nginx already sends the externally correct values
                # (https / 443); overriding them with this sidecar's own
                # $scheme and $server_port made ProxyFix build absolute
                # redirects to http://<domain>:8080/..., which is unreachable.
                proxy_http_version 1.1;
                proxy_redirect off;
                proxy_connect_timeout {{ .Values.web.nginx.proxyTimeout }};
                proxy_read_timeout {{ .Values.web.nginx.proxyTimeout }};
                proxy_send_timeout {{ .Values.web.nginx.proxyTimeout }};
                proxy_buffering off;
            }
        }
    }
