{{- include "superset.init" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-nginx-config
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_types text/plain text/css text/xml text/javascript
                   application/x-javascript application/xml+rss
                   application/json application/javascript;

        # Temp paths under /tmp so the container can run non-root.
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp_path;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        upstream superset_app {
            server 127.0.0.1:8088;
            keepalive 100;
        }

        server {
            listen {{ .Values.web.nginx.port }} default_server;
            server_name _;
            client_max_body_size {{ .Values.web.nginx.clientMaxBodySize }};

            # Emit relative Location headers. Otherwise nginx builds them from
            # its own listen port and the browser is sent to
            # https://<domain>:8080/analytics/, which is not reachable.
            absolute_redirect off;
            port_in_redirect off;

            # Probe target — kubelet has no /analytics prefix to send.
            location = /health {
                proxy_pass http://superset_app/health;
                proxy_set_header Host $http_host;
            }

            # Bare /analytics would otherwise miss the prefix location below.
            location = {{ .Values.contextPath }} {
                return 301 {{ .Values.contextPath }}/;
            }

            # Superset's "/" route redirects to a hardcoded /superset/welcome/
            # that bypasses SCRIPT_NAME, so the prefix is lost and the next hop
            # 404s here. Everything else builds URLs with url_for and picks the
            # prefix up from X-Forwarded-Prefix, so only the entry point needs
            # this shortcut.
            location = {{ .Values.contextPath }}/ {
                return 302 {{ .Values.contextPath }}/superset/welcome/;
            }

            # Paths Superset's frontend addresses from the domain root rather
            # than through the /analytics prefix. The companion Ingress routes
            # them to this pod; these pass the URI through untouched, which is
            # where Superset actually serves them.
            #
            # X-Forwarded-Prefix is still set. ProxyFix only strips the prefix
            # from PATH_INFO when it is actually there, so routing is
            # unaffected, but SCRIPT_NAME gets set and url_for() keeps
            # generating /analytics links. Without it a login posted to the
            # root /login/ redirects to "/", which the catch-all root ingress
            # sends to /workbench-ui.
            {{- range .Values.ingress.rootPaths.paths }}
            # No trailing slash and no URI on proxy_pass: the request URI goes
            # upstream untouched, so both /sqllab and /sqllab/... match.
            location {{ . }} {
                proxy_pass http://superset_app;
                proxy_set_header X-Forwarded-Prefix {{ $.Values.contextPath }};
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_http_version 1.1;
                proxy_connect_timeout {{ $.Values.web.nginx.proxyTimeout }};
                proxy_read_timeout {{ $.Values.web.nginx.proxyTimeout }};
                proxy_send_timeout {{ $.Values.web.nginx.proxyTimeout }};
                proxy_buffering off;
              {{- if eq . "/static/assets" }}
                expires 30d;
                add_header Cache-Control "public, immutable";
                access_log off;
              {{- end }}
            }
            {{- end }}

            # Superset serves at the root: APPLICATION_ROOT does not move Flask's
            # routes, it only sets the cookie path. So nginx strips the prefix
            # (the trailing / on proxy_pass) and tells Superset what it was via
            # X-Forwarded-Prefix, which ProxyFix turns into SCRIPT_NAME so
            # generated URLs keep the prefix.
            location {{ .Values.contextPath }}/static/ {
                proxy_pass http://superset_app/static/;
                proxy_set_header X-Forwarded-Prefix {{ .Values.contextPath }};
                expires 30d;
                add_header Cache-Control "public, immutable";
                access_log off;
            }

            location {{ .Values.contextPath }}/ {
                proxy_pass http://superset_app/;
                proxy_set_header X-Forwarded-Prefix {{ .Values.contextPath }};
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Port $server_port;
                proxy_http_version 1.1;
                proxy_redirect off;
                port_in_redirect off;
                proxy_connect_timeout {{ .Values.web.nginx.proxyTimeout }};
                proxy_read_timeout {{ .Values.web.nginx.proxyTimeout }};
                proxy_send_timeout {{ .Values.web.nginx.proxyTimeout }};
                proxy_buffering off;
            }
        }
    }
