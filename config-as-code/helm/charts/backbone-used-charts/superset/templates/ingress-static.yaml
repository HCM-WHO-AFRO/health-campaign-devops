{{- include "superset.init" . -}}
{{- if and .Values.ingress.enabled .Values.ingress.staticAssets.enabled }}
# Superset 4.1 emits its webpack bundle URLs unprefixed (/static/assets/...),
# because asset_bundle.html renders the manifest entry without assets_prefix.
# STATIC_ASSETS_PREFIX does not reach them, so without this route every CSS and
# JS bundle falls through to the catch-all root ingress and the UI loads
# unstyled. Kept to /static/assets rather than /static to claim as little of the
# shared domain root as possible.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}-static
  namespace: {{ .Values.namespace }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    app: {{ .Values.name }}
    group: {{ .Values.labels.group }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          - path: {{ .Values.ingress.staticAssets.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}
                port:
                  number: {{ .Values.service.port }}
  tls:
    - secretName: {{ .Values.global.domain }}-tls-certs
      hosts:
        - {{ .Values.global.domain }}
{{- end }}
