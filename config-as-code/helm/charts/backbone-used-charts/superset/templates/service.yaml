{{- include "superset.init" . -}}
{{- if .Values.web.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
    group: {{ .Values.labels.group }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Values.name }}
    component: web
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.web.nginx.port }}
      protocol: TCP
{{- end }}
