{{- include "superset.init" . -}}
{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-web
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
    group: {{ .Values.labels.group }}
    component: web
  annotations:
    # Roll only after the wave-1 migration hook has completed.
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
      component: web
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-superset.yaml") . | sha256sum }}
        checksum/nginx: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
      labels:
        app: {{ .Values.name }}
        group: {{ .Values.labels.group }}
        component: web
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: wait-for-deps
          image: {{ .Values.initContainers.waitImage }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for PostgreSQL at ${DB_HOST}:${DB_PORT}..."
              until nc -w 2 ${DB_HOST} ${DB_PORT} </dev/null; do
                sleep 2
              done
              echo "Waiting for Redis at ${REDIS_HOST}:${REDIS_PORT}..."
              until nc -w 2 ${REDIS_HOST} ${REDIS_PORT} </dev/null; do
                sleep 2
              done
              echo "Dependencies ready."
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.name }}
          resources:
            {{- toYaml .Values.initContainers.resources | nindent 12 }}
        {{- include "superset.installDrivers" . | nindent 8 }}
      containers:
        - name: superset
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.name }}
          env:
            - name: SUPERSET_PORT
              value: "8088"
            - name: FLASK_APP
              value: "superset.app:create_app()"
            - name: SUPERSET_ENV
              value: "production"
          volumeMounts:
            - name: superset-config
              mountPath: /app/pythonpath
              readOnly: true
            - name: python-packages
              mountPath: /python-packages
              readOnly: true
          command:
            - /bin/sh
            - -c
            - |
              {{ include "superset.pythonPath" . }}
              exec gunicorn \
                --bind 0.0.0.0:8088 \
                --workers {{ .Values.web.gunicorn.workers }} \
                --worker-class {{ .Values.web.gunicorn.workerClass }} \
                --threads {{ .Values.web.gunicorn.threads }} \
                --timeout {{ .Values.web.gunicorn.timeout }} \
                --keep-alive {{ .Values.web.gunicorn.keepAlive }} \
                --max-requests {{ .Values.web.gunicorn.maxRequests }} \
                --max-requests-jitter {{ .Values.web.gunicorn.maxRequestsJitter }} \
                --log-level {{ .Values.web.gunicorn.logLevel }} \
                --access-logfile - \
                --error-logfile - \
                "superset.app:create_app()"
          ports:
            - name: superset
              containerPort: 8088
              protocol: TCP
          startupProbe:
            httpGet:
              # Probed directly on the container port, bypassing the nginx
              # sidecar, so this must be the unprefixed route Superset serves.
              path: /health
              port: 8088
            initialDelaySeconds: {{ .Values.web.probes.startup.initialDelay }}
            timeoutSeconds: {{ .Values.web.probes.startup.timeout }}
            failureThreshold: {{ .Values.web.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.web.probes.startup.period }}
          livenessProbe:
            httpGet:
              # Probed directly on the container port, bypassing the nginx
              # sidecar, so this must be the unprefixed route Superset serves.
              path: /health
              port: 8088
            initialDelaySeconds: {{ .Values.web.probes.liveness.initialDelay }}
            timeoutSeconds: {{ .Values.web.probes.liveness.timeout }}
            failureThreshold: {{ .Values.web.probes.liveness.failureThreshold }}
            periodSeconds: {{ .Values.web.probes.liveness.period }}
          readinessProbe:
            httpGet:
              # Probed directly on the container port, bypassing the nginx
              # sidecar, so this must be the unprefixed route Superset serves.
              path: /health
              port: 8088
            initialDelaySeconds: {{ .Values.web.probes.readiness.initialDelay }}
            timeoutSeconds: {{ .Values.web.probes.readiness.timeout }}
            failureThreshold: {{ .Values.web.probes.readiness.failureThreshold }}
            periodSeconds: {{ .Values.web.probes.readiness.period }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}

        # Terminates the /analytics sub-path and serves static assets.
        - name: nginx
          image: {{ .Values.web.nginx.image }}
          ports:
            - name: http
              containerPort: {{ .Values.web.nginx.port }}
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.web.nginx.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.web.nginx.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.web.nginx.resources | nindent 12 }}
      volumes:
        - name: superset-config
          configMap:
            name: {{ .Values.name }}-config
            defaultMode: 0755
        - name: nginx-config
          configMap:
            name: {{ .Values.name }}-nginx-config
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: python-packages
          emptyDir: {}
{{- end }}
