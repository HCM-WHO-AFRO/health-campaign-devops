cluster-configs:
  db:
    namespace: egov
    name: db-service
    port: 5432
    targetPort: 5432

  root-ingress:
    name: root-ingress
    namespace: egov
    cert-issuer: "letsencrypt-staging"
    appRoot: workbench-ui
    serviceName: workbench-ui
    servicePort: 80
 
  nginx-errors:
    enabled: false
    name: nginx-errors
    namespace: egov
    serviceName: nginx-errors
    servicePort: 80

  configmaps:
    egov-config:
      namespace: [ egov , chaduat ]
      name: egov-config
      server-tomcat-max-connections: "500"
      server-tomcat-max-threads: "10"
      spring-datasource-tomcat-initialSize: "1"
      spring-datasource-tomcat-max-active: "2"
      spring-jpa-show-sql: "true"  

    egov-service-host:    
      name: egov-service-host
      namespace: [ egov, chaduat ] 

  secrets:
    db:
      namespace: [ egov, chaduat, chad, zambia, congob, es-cluster ]
      name: db

    egov-notification-sms:
      namespace: egov
      name: egov-notification-sms

    egov-filestore: 
      namespace: egov
      name: egov-filestore     
      
    egov-location: 
      namespace: egov
      name: egov-location

    egov-pg-service: 
      namespace: egov
      name: egov-pg-service                 

    pgadmin: 
      namespace: playground
      name: pgadmin       

    argocd-repo-server:
      namespace: argocd
      name: argocd-repo-server-azure-creds

    egov-enc-service: 
      namespace: egov
      name: egov-enc-service       

    egov-notification-mail: 
      namespace: egov
      name: egov-notification-mail

    home-isolation-notification-mail: 
      namespace: egov
      name: home-isolation-notification-mail      

    git-sync: 
      namespace: [ egov, congob, chaduat, zambia ]
      name: git-creds

    kibana: 
      namespace: egov
      name: kibana-creds                       

    kibana-infra: 
      namespace: egov
      name: kibana-infra-creds     

    pgadmin: 
      namespace: playground
      name: pgadmin

    egov-si-microservice:
      namespace: egov
      name: egov-si-microservice

    egov-edcr-notification:
      namespace: egov
      name: egov-edcr-notification 

    egov-edcr-bank-gateway:
      namespace: egov
      name: egov-edcr-bank-gateway

    chatbot:
      namespace: egov
      name: chatbot
    
    covid-chatbot:
      namespace: egov
      name: covid-chatbot

    egov-user-chatbot:
      namespace: egov
      name: egov-user-chatbot

    project-factory:
      namespace: [ egov, congob, chad, zambia ]
      name: project-factory

    oauth2-proxy:
      namespace: egov
      name: oauth2-proxy   

    case-management:
      namespace: egov
      name: case-management   
  
    minio:
      namespace: backbone
      name: minio

    alertmanager:
      namespace: monitoring
      name: alertmanager-main      

    jenkins:
      namespace: jenkins
      name: jenkins 
    
    mysql:
      namespace: egov
      name: mysql
    
    wordpress:
      namespace: egov
      name: wordpress

    postgres:
      namespace: jenkins
      name: postgres
    
    elasticsearch-master-creds:
      namespace: [ es-cluster, egov, chad, congob, zambia ]
      name: elasticsearch-master-credentials
    
    airflow:
      namespace: egov
      name: airflow
    
    sso:
      namespace: egov
      name: sso

    # Non-sensitive halves of the Superset connection strings; the passwords,
    # SECRET_KEY and admin password come from who-afro-hcm-secrets.yaml.
    superset:
      namespace: backbone
      name: superset
      db-host: ""
      db-port: "5432"
      db-name: superset
      db-user: superset
      redis-host: redis.backbone.svc.cluster.local
      redis-port: "6379"
      clickhouse-host: clickhouse.backbone.svc.cluster.local
      clickhouse-port: "8123"
      clickhouse-db: analytics
      clickhouse-user: superset

    clickhouse:
      namespace: backbone
      name: clickhouse