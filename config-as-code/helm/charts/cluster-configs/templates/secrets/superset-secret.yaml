{{- with index .Values "cluster-configs" "secrets" "superset" }}
{{- if index . "db-password" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
type: Opaque
stringData:
  # Superset reads every key below as an environment variable (envFrom).
  SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://{{ index . "db-user" }}:{{ index . "db-password" | urlquery }}@{{ index . "db-host" }}:{{ index . "db-port" }}/{{ index . "db-name" }}"
  CLICKHOUSE_SQLALCHEMY_URI: "clickhousedb://{{ index . "clickhouse-user" }}:{{ index . "clickhouse-password" | urlquery }}@{{ index . "clickhouse-host" }}:{{ index . "clickhouse-port" }}/{{ index . "clickhouse-db" }}"
  SECRET_KEY: {{ index . "secret-key" | quote }}
  ADMIN_PASSWORD: {{ index . "admin-password" | quote }}
  # Used by the wait-for-deps init container.
  DB_HOST: {{ index . "db-host" | quote }}
  DB_PORT: {{ index . "db-port" | quote }}
  REDIS_HOST: {{ index . "redis-host" | quote }}
  REDIS_PORT: {{ index . "redis-port" | quote }}
{{- end }}
{{- end }}
