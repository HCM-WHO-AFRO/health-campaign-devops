{{- with index .Values "cluster-configs" "secrets" "clickhouse" }}
{{- if index . "admin-password" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
type: Opaque
stringData:
  # default user — full access, used for schema management and ingestion.
  admin-password: {{ index . "admin-password" | quote }}
  # superset user — read-only BI access; must match the superset secret's
  # clickhouse-password.
  superset-password: {{ index . "superset-password" | quote }}
{{- end }}
{{- end }}
