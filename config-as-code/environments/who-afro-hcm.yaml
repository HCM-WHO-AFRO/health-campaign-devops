global:
  domain: campaigns.afro.who.int ## Add your Domain Name "Eg: site.mydomain.com" Do not use the dummy domain 
  setup: fullsetup
  hosts:
    - campaigns.afro.who.int
  schema:
    - chad
    - chaduat
    - congob
    - zambia

cluster-configs:
    namespaces:
      create: true
      values: [ backbone, cert-manager, egov, es-cluster, kafka-kraft, logging, monitoring, playground, zookeeper-cluster, chad, chaduat, congob, zambia ]
      
    root-ingress:
      cert-issuer: letsencrypt-prod
    configmaps:
        egov-config:
            namespace: [ egov, es-cluster, monitoring, chad, congob, chaduat, zambia ]
            data:
                db-host: afrohcm-t-euw-server.postgres.database.azure.com ## Add db-host name example: egov-demo.database.azure.com
                db-name: afrohcm-t-euw-db ## Add db-name
                db-url: "jdbc:postgresql://afrohcm-t-euw-server.postgres.database.azure.com:5432/afrohcm-t-euw-db" ## example: jdbc:postgresql://egov-demo.postgres.database.azure.com:5432/egov_demo
                db-url-no-schema: "jdbc:postgresql://afrohcm-t-euw-server.postgres.database.azure.com:5432/afrohcm-t-euw-db" ## example: jdbc:postgresql://egov-demo.postgres.database.azure.com:5432/egov_demo
                chad-db-url: "jdbc:postgresql://afrohcm-t-euw-server.postgres.database.azure.com:5432/afrohcm-t-euw-db?currentSchema=chad"
                congob-db-url: "jdbc:postgresql://afrohcm-t-euw-server.postgres.database.azure.com:5432/afrohcm-t-euw-db?currentSchema=congob"
                chaduat-db-url: "jdbc:postgresql://afrohcm-t-euw-server.postgres.database.azure.com:5432/afrohcm-t-euw-db?currentSchema=chaduat"
                zambia-db-url: "jdbc:postgresql://afrohcm-t-euw-server.postgres.database.azure.com:5432/afrohcm-t-euw-db?currentSchema=zambia"
                domain: campaigns.afro.who.int ## Add your Domain Name
                redis-host: "redis.backbone.svc.cluster.local"
                redis-downsync-host: ""
                egov-services-fqdn-name: https://campaigns.afro.who.int/ ## Add your Domain Name
                state-level-tenantid-length: "1"
                state-schema-index-position-tenantid: "0"
                is-environment-central-instance: "true"
                egov-state-level-tenant-id: "chad"
                state-level-tenant-id: "chad"
                boundary-hierarchy: "ADMIN"
                boundary-hierarchy-chad: "POLIO_CHAD"
                kafka-tenant-id-pattern: "chad-|congob-|chaduat-|zambia-"
                s3-assets-bucket: "(pg-health-egov-assets|egov-health-playground-assets)"
                es-host: "elasticsearch-data.es-cluster"
                es-host-6: "elasticsearch-data.es-cluster"
                es-indexer-host: "https://elasticsearch-master.es-cluster:9200/"
                es-indexer-host-8: "https://elasticsearch-master.es-cluster:9200/"
                flyway-locations: "filesystem:/flyway/sql,filesystem:/flyway/seed,filesystem:/flyway/qa"
                kafka-brokers: "release-name-kafka-controller-headless.kafka-kraft:9092"
                kafka-infra-brokers: "kafka-v2-infra.kafka-cluster:9092"
                logging-level-jdbc: "DEBUG"
                mobile-validation-workaround: "true"
                serializers-timezone-in-ist: "true"
                server-tomcat-max-connections: "500"
                server-tomcat-max-threads: "10"
                sms-enabled: "true"
                spring-datasource-tomcat-initialSize: "1"
                spring-datasource-tomcat-max-active: "2"
                spring-jpa-show-sql: "true"
                timezone: "UTC"
                tracer-errors-provideexceptionindetails: "true"
                egov-internal-microservice-user-uuid: fa0f820c-49df-46bb-8e62-8a0ec5d9af5e
                db-schema-names: "chad,congob,chaduat,zambia"
                kibana-base-path: kibana-upgrade 
                kibana-host: "http://kibana-v1.es-upgrade:5601/"

        egov-service-host:
            namespace: [ egov, es-cluster, monitoring, chad, congob, chaduat, zambia ]
            data:
              asset-services: "http://asset-services:8080/"
