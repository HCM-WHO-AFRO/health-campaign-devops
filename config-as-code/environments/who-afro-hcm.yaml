### Prometheus & Alertmanager >>>>>>>>>>>>>>>>>>>>
prometheus:
  retention: 90d
  storageSpec:
    volumeClaimTemplate:
      spec:
        storageClassName: default
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 30Gi
  alertmanager:
    enabled: true
  externalLabels:
    cluster: afrohcm-t-euw
  additionalScrapeConfigs:
    - job_name: 'nginx-ingress-metrics'
      static_configs:
        - targets: [ 'ingress-nginx-controller-metrics.egov:10254' ]
    - job_name: 'blackbox'
      metrics_path: /probe
      params:
        module: [ http_2xx ]
      static_configs:
        - targets:
            - https://campaigns.afro.who.int/jupyter/hub/
            - https://campaigns.afro.who.int/kibana-upgrade/
            - https://campaigns.afro.who.int/pgadmin/
      relabel_configs:
        - source_labels: [ __address__ ]
          target_label: __param_target
        - source_labels: [ __param_target ]
          target_label: instance
        - target_label: __address__
          replacement: prometheus-blackbox-exporter:9115
    - job_name: 'blackbox_exporter'
      static_configs:
        - targets: [ 'prometheus-blackbox-exporter:9115' ]
# <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<

### loki-stack >>>>>>>>>>>>>>>>>>>>>>>>>>
loki:
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 30Gi
  additionalConfigs:
    schema_config:
      configs:
        - from: 2023-10-20
          store: tsdb
          object_store: azure
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      tsdb_shipper:
        active_index_directory: /data/loki/index
        cache_location: /data/loki/index_cache
        shared_store: azure
        cache_ttl: 24h
      azure:
        container_name: loki        # Your Azure Storage Container
        account_name: whoafrolokisaprd         # Your Azure Storage Account
        account_key: <ACCOUNT_KEY_FOR_STORAGE_ACCOUNT>              # Or use managed identity
        use_managed_identity: false
        request_timeout: 0
    compactor:
      working_directory: /data/loki/tsdb-compactor
      shared_store: azure
      retention_enabled: true
      compaction_interval: 168h
